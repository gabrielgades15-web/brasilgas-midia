<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:{{W}}px;height:{{H}}px;font-family:'Montserrat',sans-serif;overflow:hidden;
 background:radial-gradient(circle at 70% 35%,#F2283A 0%,#E1061A 45%,#A30F1C 100%);color:#fff;position:relative}
.top{position:absolute;top:{{TTOP}}px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center}
.logo{background:#fff;border-radius:18px;padding:14px 22px 16px;line-height:1;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.logo .w{font-family:'Montserrat';font-weight:900;font-size:50px;letter-spacing:1px;color:#1D4FA3}
.logo .w i{font-style:normal;color:#E1061A}
.logo .p{margin-top:8px;background:#E1061A;color:#fff;font-family:'Montserrat';font-weight:800;font-size:30px;letter-spacing:3px;text-align:center;padding:6px 10px;border-radius:4px}
.selo{background:#1C3A8C;border-radius:40px;padding:12px 26px;font-weight:800;font-size:24px;letter-spacing:1px}
.kicker{position:absolute;left:60px;top:{{KTOP}}px;background:#FFC72C;color:#A30F1C;font-weight:900;font-size:30px;padding:10px 22px;border-radius:10px;text-transform:uppercase}
h1{position:absolute;left:60px;top:{{HTOP}}px;width:{{HW}}px;font-family:'Anton';font-size:{{HSIZE}}px;line-height:1.02;text-transform:uppercase;text-shadow:0 6px 0 rgba(0,0,0,.18)}
.sub{position:absolute;left:60px;top:{{STOP}}px;width:{{HW}}px;font-weight:800;font-size:36px;line-height:1.25}
.bot{position:absolute;right:{{BRIGHT}}px;bottom:{{BBOT}}px;width:{{BW}}px}
.cta{position:absolute;left:60px;right:60px;bottom:{{CBOT}}px;background:#A30F1C;border-radius:26px;padding:26px 30px;display:flex;align-items:center;gap:24px}
.wa{width:86px;height:86px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;flex:none}
.cta b{display:block;font-family:'Anton';font-size:52px;letter-spacing:1px}
.cta span{font-weight:700;font-size:24px;opacity:.95}
.foot{position:absolute;left:60px;right:60px;bottom:{{FBOT}}px;text-align:center;font-weight:700;font-size:22px;opacity:.9}
</style></head><body>
<div class="top"><div class="logo"><div class="w">BRASIL<i>GÁS</i></div><div class="p">PARAGÁS</div></div><div class="selo">REVENDA AUTORIZADA</div></div>
<div class="kicker">{{KICKER}}</div>
<h1>{{HEADLINE}}</h1>
<div class="sub">{{SUB}}</div>
<svg class="bot" viewBox="0 0 200 260">
 <defs><linearGradient id="m" x1="0" x2="1"><stop offset="0" stop-color="#8d939b"/><stop offset=".35" stop-color="#f4f6f8"/><stop offset=".6" stop-color="#c9ced4"/><stop offset="1" stop-color="#7c828a"/></linearGradient></defs>
 <rect x="62" y="6" width="76" height="46" rx="12" fill="none" stroke="url(#m)" stroke-width="12"/>
 <rect x="90" y="40" width="20" height="22" fill="url(#m)"/>
 <path d="M30 95 Q30 62 100 60 Q170 62 170 95 L170 210 Q170 236 100 238 Q30 236 30 210Z" fill="url(#m)"/>
 <rect x="30" y="118" width="140" height="6" fill="#6f757c" opacity=".5"/>

 <path d="M45 236 L45 256 L155 256 L155 236" fill="none" stroke="url(#m)" stroke-width="10"/>
